
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌈 Aprende las Letras - Juego para Niños</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="min-h-screen rainbow-bg overflow-x-hidden">
    <!-- Capa de fondo personalizable (queda detrás de todo) -->
    <div id="bgLayer" aria-hidden="true"></div>
    
    <!-- Pantalla Principal -->
    <div id="mainMenu" class="min-h-screen flex flex-col items-center justify-center p-4 minecraft-bg">
        <div class="text-center mb-8">
            <h1 class="title-font text-5xl md:text-7xl text-white drop-shadow-lg mb-4 animate-bounce-slow">
                🌈 Aprende las Letras 🌈
            </h1>
            <p class="text-xl md:text-2xl text-white drop-shadow-md">¡Vamos a aprender jugando! 🎉</p>
        </div>
        <!-- Control de selección de voz -->
        <!-- Control de selección de voz -->
        <div class="flex flex-wrap items-center justify-center gap-3 mb-6 p-2 bg-black/10 rounded-xl backdrop-blur-sm">
            <label for="voiceSelect" class="text-white font-bold">Voz:</label>
            <select id="voiceSelect" class="px-3 py-2 rounded-lg max-w-[200px]">
                <option value="">Predeterminada</option>
            </select>
            <button id="refreshVoices" onclick="populateVoiceList()" class="game-btn bg-white/90 px-4 py-2 rounded-full shadow-lg" title="Actualizar voces">🔁</button>
            <button id="previewVoice" class="game-btn bg-white/90 px-3 py-2 rounded-full shadow-lg" title="Haz clic para escuchar ejemplo">🔊</button>
            <span id="currentVoiceLabel" class="text-white text-sm w-full text-center hidden md:inline">Predeterminada</span>
        </div>
        <!-- Controles de fondo personalizable -->
        <!-- Controles de fondo personalizable -->
        <div class="flex flex-wrap items-center justify-center gap-3 mb-6 p-2 bg-black/10 rounded-xl backdrop-blur-sm">
            <input type="file" id="bgFileInput" accept="image/*" style="display:none" />
            <button onclick="document.getElementById('bgFileInput').click()" class="game-btn bg-white/90 px-4 py-2 rounded-full shadow-lg text-sm md:text-base">📁 Elegir imagen</button>
            
            <div class="flex items-center gap-2 w-full md:w-auto justify-center">
                <input id="bgUrlInput" placeholder="URL de imagen" class="px-3 py-2 rounded-lg w-full md:w-64" />
                <button onclick="applyBgUrl()" class="game-btn bg-white/90 px-3 py-2 rounded-full shadow-lg">🌐</button>
            </div>
            
            <button onclick="clearBackground()" class="game-btn bg-white/90 px-3 py-2 rounded-full shadow-lg text-red-600 font-bold">❌ Borrar</button>
        </div>
        <!-- Controles de opacidad y desenfoque para el fondo -->
        <!-- Controles de opacidad y desenfoque para el fondo -->
        <div class="flex flex-wrap items-center justify-center gap-4 mb-6 p-2 bg-black/10 rounded-xl backdrop-blur-sm text-sm md:text-base">
            <div class="flex items-center gap-2">
                <label class="text-white font-bold">Opacidad:</label>
                <input id="bgOpacityRange" type="range" min="0" max="1" step="0.01" value="1" class="h-2 w-24">
                <span id="bgOpacityLabel" class="text-white w-12 text-right">100%</span>
            </div>

            <div class="flex items-center gap-2">
                <label class="text-white font-bold">Blur:</label>
                <input id="bgBlurRange" type="range" min="0" max="20" step="1" value="0" class="h-2 w-24">
                <span id="bgBlurLabel" class="text-white w-8 text-right">0px</span>
            </div>
            
            <div class="flex items-center gap-2">
                <label class="text-white font-bold">Posición:</label>
                <select id="bgPositionSelect" class="px-2 py-1 rounded cursor-pointer">
                    <option value="center">Centro</option>
                    <option value="top">Arriba</option>
                    <option value="left">Izquierda</option>
                </select>
            </div>

            <div class="flex items-center gap-2">
                <label class="text-white font-bold">Tamaño:</label>
                <select id="bgSizeSelect" class="px-2 py-1 rounded cursor-pointer">
                    <option value="cover">Cover</option>
                    <option value="contain">Contain</option>
                </select>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-4xl w-full">
            <!-- Botón Abecedario -->
            <button onclick="showScreen('alphabet')" class="game-btn bg-gradient-to-br from-pink-400 to-pink-600 p-8 rounded-3xl shadow-2xl text-white">
                <div class="text-6xl mb-4">🔤</div>
                <h2 class="title-font text-2xl md:text-3xl">El Abecedario</h2>
                <p class="text-lg opacity-90">Conoce todas las letras</p>
            </button>
            
            <!-- Botón Encuentra la Letra -->
            <button onclick="showScreen('findLetter')" class="game-btn bg-gradient-to-br from-blue-400 to-blue-600 p-8 rounded-3xl shadow-2xl text-white">
                <div class="text-6xl mb-4">🔍</div>
                <h2 class="title-font text-2xl md:text-3xl">Encuentra la Letra</h2>
                <p class="text-lg opacity-90">¿Puedes encontrarla?</p>
            </button>
            
            <!-- Botón Palabras -->
            <button onclick="showScreen('words')" class="game-btn bg-gradient-to-br from-green-400 to-green-600 p-8 rounded-3xl shadow-2xl text-white">
                <div class="text-6xl mb-4">📖</div>
                <h2 class="title-font text-2xl md:text-3xl">Aprende Palabras</h2>
                <p class="text-lg opacity-90">Letras que forman palabras</p>
            </button>
            
            <!-- Botón Completa la Palabra -->
            <button onclick="showScreen('complete')" class="game-btn bg-gradient-to-br from-purple-400 to-purple-600 p-8 rounded-3xl shadow-2xl text-white">
                <div class="text-6xl mb-4">✏️</div>
                <h2 class="title-font text-2xl md:text-3xl">Completa la Palabra</h2>
                <p class="text-lg opacity-90">¿Qué letra falta?</p>
            </button>
        </div>
        
        <!-- Personaje animado -->
        <div class="mt-8 text-8xl animate-float">🦊</div>
        <!-- Bloques decorativos pixelados (estilo Minecraft) -->
        <div class="pixel-block" style="left:8%; top:18%; background: linear-gradient(#dbe88a,#b6d25a);"></div>
        <div class="pixel-block" style="left:72%; top:14%; width:64px; height:64px; background: linear-gradient(#f1d07a,#e0b24a);"></div>
        <div class="pixel-block" style="left:48%; top:6%; width:48px; height:48px; background: linear-gradient(#c1e08f,#8fc74a);"></div>
    </div>
    
    <!-- Pantalla del Abecedario -->
    <div id="alphabetScreen" class="min-h-screen p-4 hidden">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <button onclick="showScreen('main')" class="game-btn bg-white/90 px-6 py-3 rounded-full text-2xl shadow-lg">
                    ⬅️ Volver
                </button>
                <h2 class="title-font text-3xl md:text-4xl text-white drop-shadow-lg">🔤 El Abecedario 🔤</h2>
                <div class="w-24"></div>
            </div>
            
            <div id="alphabetGrid" class="grid grid-cols-4 md:grid-cols-7 gap-3 md:gap-4">
                <!-- Las letras se generan con JavaScript -->
            </div>
        </div>
        
        <!-- Modal de letra -->
        <div id="letterModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
            <div class="bg-white rounded-3xl p-8 m-4 max-w-md w-full text-center animate-pop shadow-2xl">
                <div id="modalLetter" class="text-9xl title-font mb-4"></div>
                <div id="modalEmoji" class="text-6xl mb-4"></div>
                <p id="modalWord" class="text-3xl title-font text-gray-700 mb-6"></p>
                <button onclick="speakLetter()" class="game-btn bg-gradient-to-r from-yellow-400 to-orange-400 text-white px-8 py-4 rounded-full text-xl mr-2">
                    🔊 Escuchar
                </button>
                <button onclick="closeModal()" class="game-btn bg-gradient-to-r from-gray-400 to-gray-500 text-white px-8 py-4 rounded-full text-xl">
                    ✖️ Cerrar
                </button>
            </div>
        </div>
    </div>
    
    <!-- Pantalla Encuentra la Letra -->
    <div id="findLetterScreen" class="min-h-screen p-4 hidden">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <button onclick="showScreen('main')" class="game-btn bg-white/90 px-6 py-3 rounded-full text-2xl shadow-lg">
                    ⬅️ Volver
                </button>
                <div class="bg-white/90 px-6 py-2 rounded-full shadow-lg">
                    <span class="text-2xl">⭐</span>
                    <span id="findScore" class="title-font text-2xl text-purple-600">0</span>
                </div>
            </div>
            
            <div class="bg-white/95 rounded-3xl p-6 md:p-10 shadow-2xl text-center">
                <p class="text-xl md:text-2xl text-gray-600 mb-4">¡Encuentra la letra!</p>
                <div id="targetLetter" class="text-7xl md:text-9xl title-font text-purple-600 mb-8 animate-wiggle"></div>
                
                <div id="letterOptions" class="grid grid-cols-3 gap-4 max-w-lg mx-auto">
                    <!-- Opciones generadas con JS -->
                </div>
                
                <div id="findFeedback" class="mt-6 text-3xl hidden"></div>
            </div>
            
            <div class="text-center mt-6">
                <div class="text-8xl animate-bounce-slow">🐻</div>
            </div>
        </div>
    </div>
    
    <!-- Pantalla Aprende Palabras -->
    <div id="wordsScreen" class="min-h-screen p-4 hidden">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <button onclick="showScreen('main')" class="game-btn bg-white/90 px-6 py-3 rounded-full text-2xl shadow-lg">
                    ⬅️ Volver
                </button>
                <h2 class="title-font text-2xl md:text-3xl text-white drop-shadow-lg">📖 Aprende Palabras</h2>
                <div class="w-24"></div>
            </div>
            
            <div class="bg-white/95 rounded-3xl p-6 md:p-10 shadow-2xl text-center">
                <div id="wordEmoji" class="text-8xl md:text-9xl mb-6"></div>
                <div id="wordDisplay" class="flex justify-center gap-2 mb-6 flex-wrap">
                    <!-- Letras de la palabra -->
                </div>
                <p id="wordText" class="text-3xl md:text-4xl title-font text-gray-700 mb-6"></p>
                
                <div class="flex justify-center gap-4 flex-wrap">
                    <button onclick="speakWord()" class="game-btn bg-gradient-to-r from-yellow-400 to-orange-400 text-white px-8 py-4 rounded-full text-xl">
                        🔊 Escuchar
                    </button>
                    <button onclick="nextWord()" class="game-btn bg-gradient-to-r from-green-400 to-green-600 text-white px-8 py-4 rounded-full text-xl">
                        ➡️ Siguiente
                    </button>
                </div>
            </div>
            
            <div class="text-center mt-6">
                <div class="text-8xl animate-float">🦁</div>
            </div>
        </div>
    </div>
    
    <!-- Pantalla Completa la Palabra -->
    <div id="completeScreen" class="min-h-screen p-4 hidden">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <button onclick="showScreen('main')" class="game-btn bg-white/90 px-6 py-3 rounded-full text-2xl shadow-lg">
                    ⬅️ Volver
                </button>
                <div class="bg-white/90 px-6 py-2 rounded-full shadow-lg">
                    <span class="text-2xl">⭐</span>
                    <span id="completeScore" class="title-font text-2xl text-purple-600">0</span>
                </div>
            </div>
            
            <div class="bg-white/95 rounded-3xl p-6 md:p-10 shadow-2xl text-center">
                <div id="completeEmoji" class="text-7xl md:text-8xl mb-6"></div>
                <div id="completeWordDisplay" class="flex justify-center gap-2 mb-8 flex-wrap">
                    <!-- Palabra con letra faltante -->
                </div>
                
                <p class="text-xl text-gray-600 mb-4">¿Qué letra falta?</p>
                
                <div id="completeOptions" class="flex justify-center gap-4 flex-wrap">
                    <!-- Opciones de letras -->
                </div>
                
                <div id="completeFeedback" class="mt-6 text-3xl hidden"></div>
            </div>
            
            <div class="text-center mt-6">
                <div class="text-8xl animate-bounce-slow">🐰</div>
            </div>
        </div>
    </div>

    <script src="js/script.js" defer></script>
</body>
</html>
